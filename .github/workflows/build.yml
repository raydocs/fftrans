name: Build and deploy Tataru Assistant
on:
  push:
    branches:
      - main

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.auto-check.outputs.status }}
      release_tag: ${{ steps.auto-check.outputs.release_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Execute version check script
        id: auto-check
        run: bash .github/workflows/autocheck.sh

  build-windows:
    needs: version-check
    if: needs.version-check.outputs.status == 'ready'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows x64 installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --win --x64

      - name: List build artifacts
        run: |
          Write-Host "=== Build Artifacts ==="
          if (Test-Path "build") {
            Get-ChildItem build -Recurse | Where-Object { !$_.PSIsContainer } | ForEach-Object {
              $size = "$([math]::Round($_.Length/1MB, 2)) MB"
              Write-Host "$($_.Name) - $size"
            }
          }
        shell: powershell

      - name: Create release
        id: create_release
        uses: comnoco/create-release-action@v2
        env:
          RELEASE_VERSION: ${{ needs.version-check.outputs.release_tag }}
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          release_name: Release v${{ env.RELEASE_VERSION }}

      - name: Upload Windows installer
        uses: actions/upload-release-asset@v1
        env:
          RELEASE_VERSION: ${{ needs.version-check.outputs.release_tag }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/Tataru Assistant Setup ${{ needs.version-check.outputs.release_tag }}.exe
          asset_name: Tataru_Assistant_Setup.exe
          asset_content_type: application/octet-stream

  build-macos:
    needs: [version-check, build-windows]
    if: needs.version-check.outputs.status == 'ready'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS dmg (arm64 + x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --mac --arm64 --x64

      - name: Resolve dmg path
        id: resolve_dmg
        run: |
          DMG=$(find build -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "No .dmg found in build output."
            exit 1
          fi
          echo "dmg_path=$DMG" >> "$GITHUB_OUTPUT"
          echo "Resolved dmg: $DMG"

      - name: Upload macOS dmg to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.version-check.outputs.release_tag }}" "${{ steps.resolve_dmg.outputs.dmg_path }}" --clobber

  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 6
