name: Build and deploy Tataru Assistant
on:
  push:
    branches:
      - main

jobs:
  version-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      status: ${{ steps.auto-check.outputs.status }}
      release_tag: ${{ steps.auto-check.outputs.release_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Execute version check script
        id: auto-check
        run: bash .github/workflows/autocheck.sh

  preflight:
    needs: version-check
    if: needs.version-check.outputs.status == 'ready'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint targeted code paths
        run: npm run lint

      - name: Syntax and release-asset verification
        run: npm run test

      - name: Verify workflow shell syntax
        run: bash -n .github/workflows/autocheck.sh

  build-windows:
    needs: [version-check, preflight]
    if: needs.version-check.outputs.status == 'ready'
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows x64 installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --win --x64

      - name: List build artifacts
        run: |
          Write-Host "=== Build Artifacts ==="
          if (Test-Path "build") {
            Get-ChildItem build -Recurse | Where-Object { !$_.PSIsContainer } | ForEach-Object {
              $size = "$([math]::Round($_.Length/1MB, 2)) MB"
              Write-Host "$($_.Name) - $size"
            }
          }
        shell: powershell

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/Tataru Assistant Setup ${{ needs.version-check.outputs.release_tag }}.exe
          if-no-files-found: error

  build-macos:
    needs: [version-check, preflight]
    if: needs.version-check.outputs.status == 'ready'
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS dmg (arm64 + x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --mac --arm64 --x64

      - name: Resolve dmg path
        id: resolve_dmg
        run: |
          DMG=$(find build -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "No .dmg found in build output."
            exit 1
          fi
          echo "dmg_path=$DMG" >> "$GITHUB_OUTPUT"
          echo "Resolved dmg: $DMG"

      - name: Upload macOS dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ${{ steps.resolve_dmg.outputs.dmg_path }}
          if-no-files-found: error

  release:
    needs: [version-check, build-windows, build-macos]
    if: needs.version-check.outputs.status == 'ready'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: release-assets/macos

      - name: Create or update release
        run: |
          TAG="v${{ needs.version-check.outputs.release_tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Release $TAG" --notes ""
          for asset in release-assets/windows/* release-assets/macos/*; do
            [ -e "$asset" ] || continue
            gh release upload "$TAG" "$asset" --clobber
          done

  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 6
