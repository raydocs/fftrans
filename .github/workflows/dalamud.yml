name: Dalamud plugin

on:
  push:
    paths:
      - 'dalamud/FFTransDalamud/**'
      - 'src/module/system/dalamud-bridge.js'
      - 'scripts/verify-dalamud-*.js'
      - '.github/workflows/dalamud.yml'
  pull_request:
    paths:
      - 'dalamud/FFTransDalamud/**'
      - 'src/module/system/dalamud-bridge.js'
      - 'scripts/verify-dalamud-*.js'
      - '.github/workflows/dalamud.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DALAMUD_HOME: ${{ runner.temp }}\dalamud-dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Download official Dalamud development files
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          New-Item -ItemType Directory -Force -Path $env:DALAMUD_HOME | Out-Null
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\dalamud.zip" -DestinationPath $env:DALAMUD_HOME -Force

      - name: Build and test C# plugin
        shell: pwsh
        run: |
          dotnet restore dalamud\FFTransDalamud\FFTransDalamud.sln
          dotnet build dalamud\FFTransDalamud\FFTransDalamud.sln -c Release --no-restore
          dotnet test dalamud\FFTransDalamud\FFTransDalamud.sln -c Release --no-build --logger "console;verbosity=minimal"

      - name: Verify Node bridge
        run: node scripts/verify-dalamud-bridge.js

      - name: Verify Node and C# interoperability
        run: node scripts/verify-dalamud-cross-language.js

      - uses: actions/upload-artifact@v4
        with:
          name: FFTransDalamud
          path: dalamud/FFTransDalamud/src/FFTransDalamud/bin/x64/Release/FFTransDalamud/latest.zip
          if-no-files-found: error

